defaultTasks = ['clean', 'build']


buildscript {
    apply from: 'properties.gradle'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        //classpath("gradle.plugin.com.gorylenko.gradle-git-properties:gradle-git-properties:${gradleGitPropertiesVersion}")
    }
}

apply plugin: 'base'

allprojects {
    apply plugin: 'idea'
    apply plugin: 'eclipse'

    repositories {
       mavenCentral()

    }
    group = 'com.nextgen.sourcing.task-scheduler'

}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'

    repositories {
        mavenCentral()  // Define where dependencies should be fetched from

    }
    project.dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-sleuth'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation "org.springframework.boot:spring-boot-starter-test"
    }
    project.dependencyManagement {
        imports {
            mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
            mavenBom("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
        }
    }

    jacoco{
        toolVersion = "0.8.5"
    }
    jacocoTestReport {
        dependsOn test  // Ensure that tests are run before generating the report

        reports {
            xml.required = true  // Enable XML report
            //html.enabled = true  // Enable HTML report
            csv.required = false  // Optionally disable CSV report
        }
    }
    test.finalizedBy jacocoTestReport

    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    // Publish configuration
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java // Publish the Java component (JAR)
                groupId = 'com.example'
                artifactId = 'my-artifact'
                version = '1.0.0'
            }
    }
        repositories {
            maven {
                url = uri("file://${buildDir}/repo")  // Local repo for testing
            }
        }
    }

}
